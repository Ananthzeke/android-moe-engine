name: Inference integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLAMA_COMMIT: ff5a23376725e5a889fa0bfb987b7541dc304da0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: |
          git clone https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          git -C /tmp/llama.cpp checkout "$LLAMA_COMMIT"
          git -C /tmp/llama.cpp apply "$GITHUB_WORKSPACE/patches/0001-ggml-moe-materializer.patch"
          git -C /tmp/llama.cpp apply "$GITHUB_WORKSPACE/patches/0002-llama-no-eager-mmap-prefetch.patch"
          git -C /tmp/llama.cpp add --intent-to-add -- ggml/include/ggml-moe.h
      - run: |
          .venv/bin/cmake -S /tmp/llama.cpp -B /tmp/llama-build -GNinja             -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF
          .venv/bin/cmake --build /tmp/llama-build --target llama -j 2
      - run: |
          PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH" \
          AME_LLAMA_SOURCE=/tmp/llama.cpp AME_LLAMA_BUILD=/tmp/llama-archs-build \
          sh tools/generate_qwen35_fixture.sh /tmp/fixture
          sh tools/generate_qwen35_fixture.sh /tmp/fixture-layered 1234 0.1 qwen2moe
      - run: |
          AME_LLAMA_SOURCE_DIR=/tmp/llama.cpp \
          AME_LLAMA_HOST_LIB_DIR=/tmp/llama-build \
          AME_FIXTURE_MODEL=/tmp/fixture/qwen35moe-moe.gguf \
          AME_LAYERED_FIXTURE_MODEL=/tmp/fixture-layered/qwen2moe-moe.gguf \
          .venv/bin/python tools/verify_inference.py --configs debug,release,sanitizers
