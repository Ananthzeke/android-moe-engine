site_name: Android MoE Engine
site_description: Experimental Android ARM64 CPU inference with storage-backed expert streaming
site_url: https://ananthzeke.github.io/android-moe-engine/
repo_url: https://github.com/Ananthzeke/android-moe-engine
repo_name: Ananthzeke/android-moe-engine
edit_uri: edit/main/site-docs/
docs_dir: site-docs
site_dir: site
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Overview: index.md
  - Installation: installation.md
  - Android phone: android.md
  - API examples: api.md
  - Models and measurements: models.md
  - Troubleshooting: troubleshooting.md
